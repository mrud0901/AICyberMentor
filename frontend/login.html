<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AI Mentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .error-message {
            color: #f87171; /* text-red-400 */
            font-size: 0.875rem; /* text-sm */
            margin-top: 0.5rem; /* mt-2 */
        }
    </style>
    <script src="validation.js" defer></script>
</head>
<body class="bg-slate-900 text-gray-200 antialiased">
    <!-- Header -->
    <header class="bg-slate-900/80 shadow-sm sticky top-0 z-50 backdrop-blur-md w-full" style="background: none;">
        <nav class="w-full px-6 py-5 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-3">
                <svg class="h-8 w-8 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.623 0-1.314-.21-2.57-.598-3.75" />
                </svg>
                <span class="text-2xl font-bold text-white">AI Mentor</span>
            </a>
            <!-- Mobile Hamburger -->
            <button id="mobile-nav-toggle" class="md:hidden text-2xl text-gray-200 focus:outline-none ml-2">
                <i class="fas fa-bars"></i>
            </button>
            <nav id="main-nav" class="hidden md:flex items-center space-x-6 fixed md:static top-0 left-0 w-3/4 max-w-xs h-full bg-slate-900 z-50 md:w-auto md:h-auto md:bg-transparent md:shadow-none shadow-lg transition-transform duration-300 -translate-x-full md:translate-x-0">
                <a href="index.html" class="block md:inline px-6 md:px-3 py-4 md:py-2 text-gray-300 font-medium hover:text-white transition-all duration-300">Home</a>
                <a href="signup.html" class="block md:inline px-6 md:px-3 py-4 md:py-2 text-gray-300 font-medium hover:text-white transition-all duration-300">Sign Up</a>
            </nav>
        </nav>
        <!-- Mobile nav overlay -->
        <div id="mobile-nav-overlay" class="fixed inset-0 bg-black bg-opacity-40 z-40 hidden md:hidden"></div>
    </header>

    <div class="flex flex-col items-center justify-center min-h-screen px-4">
            <script>
                // Mobile nav toggle
                document.addEventListener('DOMContentLoaded', () => {
                    const mobileNavToggle = document.getElementById('mobile-nav-toggle');
                    const mainNav = document.getElementById('main-nav');
                    const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
                    if (mobileNavToggle && mainNav && mobileNavOverlay) {
                        mobileNavToggle.addEventListener('click', () => {
                            mainNav.classList.remove('hidden');
                            mainNav.classList.add('flex');
                            mainNav.classList.add('translate-x-0');
                            mobileNavOverlay.classList.remove('hidden');
                        });
                        mobileNavOverlay.addEventListener('click', () => {
                            mainNav.classList.add('-translate-x-full');
                            setTimeout(() => {
                                mainNav.classList.remove('flex');
                                mainNav.classList.add('hidden');
                                mobileNavOverlay.classList.add('hidden');
                            }, 300);
                        });
                    }
                });
            </script>
        <div class="w-full max-w-md">
            <a href="index.html" class="flex items-center justify-center space-x-3 mb-8">
                <svg class="h-8 w-8 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.623 0-1.314-.21-2.57-.598-3.75" />
                </svg>
                <span class="text-2xl font-bold text-white">AI Mentor</span>
            </a>
            
            <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-lg p-8">
                <h2 class="text-2xl font-bold text-center text-white mb-6">Log In to Your Account</h2>
                <form id="login-form" novalidate>
                    <div class="space-y-6">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-300">Email address</label>
                            <div class="mt-1">
                                <input id="email" name="email" type="email" autocomplete="email" required
                                       class="w-full bg-slate-700 border border-slate-600 rounded-md shadow-sm py-3 px-4 text-white focus:outline-none focus:ring-purple-500 focus:border-purple-500">
                            </div>
                            <p id="email-error" class="error-message"></p>
                        </div>

                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                            <div class="mt-1">
                                <input id="password" name="password" type="password" autocomplete="current-password" required
                                       class="w-full bg-slate-700 border border-slate-600 rounded-md shadow-sm py-3 px-4 text-white focus:outline-none focus:ring-purple-500 focus:border-purple-500">
                            </div>
                            <p id="password-error" class="error-message"></p>
                        </div>

                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 bg-slate-700 border-slate-600 text-purple-600 focus:ring-purple-500 rounded">
                                <label for="remember-me" class="ml-2 block text-sm text-gray-300">Remember me</label>
                            </div>

                            <div class="text-sm">
                                <a href="#" class="font-medium text-purple-400 hover:text-purple-300">Forgot your password?</a>
                            </div>
                        </div>

                        <p id="form-error" class="error-message text-center"></p>

                        <div>
                            <button type="submit"
                                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-800 focus:ring-purple-500 transition-all duration-300">
                                Log In
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <p class="mt-6 text-center text-sm text-gray-400">
                Don't have an account?
                <a href="signup.html" class="font-medium text-purple-400 hover:text-purple-300">
                    Sign up
                </a>
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                clearErrors(form);

                const submitButton = form.querySelector('button[type="submit"]');
                const email = form.email.value.trim();
                const password = form.password.value;
                let isValid = true;

                if (!validateEmail(email)) {
                    displayError('email', 'Please enter a valid email address.');
                    isValid = false;
                }

                const passwordValidationResult = validatePassword(password);
                if (passwordValidationResult !== true) {
                    displayError('password', passwordValidationResult);
                    isValid = false;
                }

                if (!isValid) {
                    return;
                }

                const formError = document.getElementById('form-error');
                formError.textContent = '';

                const payload = { email, password };

                submitButton.disabled = true;
                submitButton.classList.add('opacity-70');

                const API_BASE_URL = "https://ai-cyber-mentor.vercel.app";

                fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                })
                .then(async response => {
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data?.message || 'Unable to log in. Please try again.');
                    }
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userName', data.user.fullName);
                    window.location.href = 'dashboard.html';
                })
                .catch(error => {
                    formError.textContent = error.message;
                })
                .finally(() => {
                    submitButton.disabled = false;
                    submitButton.classList.remove('opacity-70');
                });

             
            });
        });
    </script>
</body>
</html>
