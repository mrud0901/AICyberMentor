<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - AI Mentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .error-message {
            color: #f87171;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }
    </style>
    <script src="validation.js" defer></script>
</head>

<body class="bg-slate-900 text-gray-200 antialiased">

<div class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-white mb-6">Log In to Your Account</h2>

        <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-lg p-8">
            <form id="login-form" novalidate>
                <div class="space-y-6">

                    <div>
                        <label class="block text-sm font-medium text-gray-300">Email address</label>
                        <input id="email" name="email" type="email" required
                            class="w-full bg-slate-700 border border-slate-600 rounded-md py-3 px-4 text-white">
                        <p id="email-error" class="error-message"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300">Password</label>
                        <input id="password" name="password" type="password" required
                            class="w-full bg-slate-700 border border-slate-600 rounded-md py-3 px-4 text-white">
                        <p id="password-error" class="error-message"></p>
                    </div>

                    <p id="form-error" class="error-message text-center"></p>

                    <button type="submit"
                        class="w-full py-3 rounded-md bg-purple-600 hover:bg-purple-700 text-white">
                        Log In
                    </button>

                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('login-form');

    form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearErrors(form);

        const submitButton = form.querySelector('button');
        const email = form.email.value.trim();
        const password = form.password.value;

        let isValid = true;

        if (!validateEmail(email)) {
            displayError('email', 'Please enter a valid email address.');
            isValid = false;
        }

        const passwordValidation = validatePassword(password);
        if (passwordValidation !== true) {
            displayError('password', passwordValidation);
            isValid = false;
        }

        if (!isValid) return;

        const formError = document.getElementById('form-error');
        formError.textContent = '';

        submitButton.disabled = true;
        submitButton.classList.add('opacity-70');

        const API_BASE_URL = "https://ai-cyber-mentor.vercel.app";

        fetch(`${API_BASE_URL}/api/auth/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        })
        .then(async response => {
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.message || "Login failed");
            }

            localStorage.setItem("authToken", data.token);
            localStorage.setItem("userName", data.user.fullName);
            window.location.href = "dashboard.html";
        })
        .catch(error => {
            formError.textContent = error.message;
        })
        .finally(() => {
            submitButton.disabled = false;
            submitButton.classList.remove('opacity-70');
        });
    });
});
</script>

</body>
</html>
