<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - AI Cyber Mentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-gray-300">

    <div class="min-h-screen w-full flex flex-col">
        <!-- Header -->
        <header class="bg-white dark:bg-slate-800 shadow-md w-full">
            <div class="w-full px-4 py-4 flex items-center justify-between">
                <div class="flex items-center">
                    <a href="dashboard.html" class="flex items-center space-x-2">
                        <svg class="h-8 w-8 text-indigo-600 dark:text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                        <span class="text-xl font-bold text-gray-900 dark:text-white">AI Mentor</span>
                    </a>
                </div>
                <!-- Mobile Hamburger -->
                <button id="mobile-nav-toggle" class="md:hidden text-2xl text-gray-700 dark:text-gray-200 focus:outline-none ml-2">
                    <i class="fas fa-bars"></i>
                </button>
                <nav class="hidden md:flex items-center space-x-4">
                    <a href="dashboard.html" class="px-3 py-2 text-gray-700 dark:text-white hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg">Dashboard</a>
                    <a href="learninghub.html" class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700 rounded-lg">Learning Hub</a>
                    <a href="chatbot.html" class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700 rounded-lg">Chatbot</a>
                    <a href="databreach.html" class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700 rounded-lg">Data Breach Check</a>
                    <a href="settings.html" class="px-3 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700 rounded-lg">Settings</a>
                </nav>
                <div class="flex items-center space-x-4">
                    <button id="theme-toggle" class="text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700 rounded-lg p-2">
                        <i class="fas fa-sun" id="theme-icon-sun"></i>
                        <i class="fas fa-moon hidden" id="theme-icon-moon"></i>
                    </button>
                    <div class="relative">
                        <button id="user-menu-button" class="flex items-center space-x-2">
                            <span id="user-name" class="font-semibold text-gray-700 dark:text-gray-300"></span>
                            <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <div id="user-menu" class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-md shadow-lg py-1 hidden">
                            <a href="profile.html" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700">Profile</a>
                            <button id="logout-button" class="w-full text-left block px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Mobile nav overlay -->
            <div id="mobile-nav-overlay" class="fixed inset-0 bg-black bg-opacity-40 z-40 hidden md:hidden"></div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-6 py-12">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">Manage Your Profile</h1>
            <div id="loading-state" class="text-center py-12"><p class="text-lg text-gray-500 dark:text-gray-400">Loading your profile...</p></div>
            <div id="profile-content" class="hidden max-w-2xl mx-auto">
                <div class="bg-white dark:bg-slate-800 border-gray-200 dark:border-slate-700 rounded-lg shadow-sm p-8">
                    <form id="profile-form">
                        <div class="space-y-6">
                            <div>
                                <label for="full-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Full Name</label>
                                <div class="mt-1"><input type="text" name="full-name" id="full-name" autocomplete="name" class="w-full bg-white dark:bg-slate-700 border border-gray-300 dark:border-slate-600 rounded-md shadow-sm py-3 px-4 text-gray-900 dark:text-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 transition-all"></div>
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email Address</label>
                                <div class="mt-1"><input type="email" name="email" id="email" autocomplete="email" class="w-full bg-gray-100 dark:bg-slate-900/50 border border-gray-300 dark:border-slate-700 rounded-md shadow-sm py-3 px-4 text-gray-500 dark:text-gray-400 cursor-not-allowed" disabled><p class="mt-2 text-xs text-gray-500 dark:text-gray-400">Email address cannot be changed.</p></div>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Account Created</p>
                                <p id="user-created-at" class="text-lg text-gray-900 dark:text-white mt-1">-</p>
                            </div>
                        </div>
                        <div class="mt-8 pt-5 border-t border-gray-200 dark:border-slate-700">
                            <div class="flex justify-end"><button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-md transition-all duration-300 transform hover:scale-105 dark:bg-purple-600 dark:hover:bg-purple-700">Save Changes</button></div>
                        </div>
                    </form>
                </div>
            </div>
            <div id="error-state" class="hidden text-center mt-8"><p class="text-red-500 dark:text-red-400">Could not load your profile. Please try logging in again.</p><a href="login.html" class="mt-4 inline-block text-indigo-600 hover:text-indigo-500 dark:text-purple-400 dark:hover:text-purple-300">Go to Login</a></div>
        </main>
    </div>
    <script>
        // Mobile nav toggle
        document.addEventListener('DOMContentLoaded', () => {
            const mobileNavToggle = document.getElementById('mobile-nav-toggle');
            const mainNav = document.getElementById('main-nav');
            const mobileNavOverlay = document.getElementById('mobile-nav-overlay');
            if (mobileNavToggle && mainNav && mobileNavOverlay) {
                mobileNavToggle.addEventListener('click', () => {
                    mainNav.classList.remove('hidden');
                    mainNav.classList.add('flex');
                    mainNav.classList.add('translate-x-0');
                    mobileNavOverlay.classList.remove('hidden');
                });
                mobileNavOverlay.addEventListener('click', () => {
                    mainNav.classList.add('-translate-x-full');
                    setTimeout(() => {
                        mainNav.classList.remove('flex');
                        mainNav.classList.add('hidden');
                        mobileNavOverlay.classList.add('hidden');
                    }, 300);
                });
            }
        });
        // Theme toggle functionality
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            const html = document.documentElement;

            function updateThemeIcons() {
                if (html.classList.contains('dark')) {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                }
            }

            updateThemeIcons();

            themeToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeIcons();
            });

            // User menu functionality
            const userMenuButton = document.getElementById('user-menu-button');
            const userMenu = document.getElementById('user-menu');
            const userName = document.getElementById('user-name');
            const logoutButton = document.getElementById('logout-button');

            userMenuButton.addEventListener('click', () => {
                userMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!userMenuButton.contains(e.target) && !userMenu.contains(e.target)) {
                    userMenu.classList.add('hidden');
                }
            });

            // Check authentication
            const token = localStorage.getItem('authToken');
            const cachedName = localStorage.getItem('userName');

            if (!token) {
                window.location.href = 'login.html';
            } else {
                fetch('http://localhost:4000/api/auth/me', {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                })
                    .then(async (response) => {
                        if (!response.ok) {
                            throw new Error('Session expired.');
                        }
                        const data = await response.json();
                        const name = data?.user?.fullName || cachedName || 'User';
                        localStorage.setItem('userName', name);
                        userName.textContent = name;
                    })
                    .catch(() => {
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userName');
                        window.location.href = 'login.html';
                    });
            }

            // Logout functionality
            logoutButton.addEventListener('click', () => {
                localStorage.removeItem('authToken');
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
            });

            // Profile logic (unchanged)
            const loadingState = document.getElementById('loading-state');
            const profileContent = document.getElementById('profile-content');
            const errorState = document.getElementById('error-state');
            const profileForm = document.getElementById('profile-form');
            fetch('http://localhost:4000/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } })
            .then(async response => {
                if (!response.ok) { throw new Error('Authentication failed'); }
                return response.json();
            })
            .then(data => {
                const user = data.user;
                document.getElementById('full-name').value = user.fullName;
                document.getElementById('email').value = user.email;
                const createdAt = new Date(user.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('user-created-at').textContent = createdAt;
                loadingState.classList.add('hidden');
                profileContent.classList.remove('hidden');
            })
            .catch(error => {
                console.error('Error fetching profile:', error);
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
            });
            profileForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const fullName = document.getElementById('full-name').value;
                const saveButton = profileForm.querySelector('button[type="submit"]');
                const originalButtonText = saveButton.textContent;
                saveButton.textContent = 'Saving...';
                saveButton.disabled = true;
                fetch('http://localhost:4000/api/user/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ fullName })
                })
                .then(response => {
                    if (!response.ok) { throw new Error('Failed to update profile'); }
                    return response.json();
                })
                .then(data => {
                    alert('Profile updated successfully!');
                    localStorage.setItem('userName', fullName); 
                    document.getElementById('user-name').textContent = fullName;
                })
                .catch(error => {
                    console.error('Error updating profile:', error);
                    alert('An error occurred. Please try again.');
                })
                .finally(() => {
                    saveButton.textContent = originalButtonText;
                    saveButton.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
